name: Deploy Demo To GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - client/**
      - .github/workflows/demo-pages.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      # npm ci is fragile here: the lockfile's linux gnu/musl split optional
      # deps (rollup/lightningcss, pulled in via vite) don't reliably carry
      # libc metadata (verified 2026-08-22),
      # same reasoning as the Dockerfile's client stage. npm install
      # re-resolves optional deps against the runner instead.
      - name: Install client dependencies
        working-directory: client
        run: npm install --no-audit --prefer-offline --include=optional

      - name: Build static demo
        working-directory: client
        env:
          VITE_DEMO_MODE: "true"
          VITE_BASE_PATH: "/zomboid-control-panel/"
        run: npm run build

      - name: Publish to gh-pages branch
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: client/dist
          force_orphan: true
