name: Deploy Demo To GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - apps/panel-client/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .github/workflows/demo-pages.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 11.24.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm

      - name: Enable pnpm
        run: corepack enable && corepack install

      - name: Install client dependencies
        run: pnpm install --filter @better-zcp/panel-client --frozen-lockfile

      - name: Build static demo
        env:
          VITE_DEMO_MODE: "true"
          VITE_BASE_PATH: "/better-zcp/"
        run: pnpm --filter @better-zcp/panel-client build

      - name: Publish to gh-pages branch
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: apps/panel-client/dist
          force_orphan: true
