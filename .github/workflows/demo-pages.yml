name: Deploy Demo To GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - apps/panel-client/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .github/workflows/demo-pages.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: pnpm/action-setup@d9184bf108216479bc5a137cc391f4d7b14c870b
        with:
          version: 11.24.0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: pnpm

      - name: Enable pnpm
        run: corepack enable && corepack install

      - name: Install client dependencies
        run: pnpm install --filter @better-zcp/panel-client --frozen-lockfile

      - name: Build static demo
        env:
          VITE_DEMO_MODE: "true"
          VITE_BASE_PATH: "/better-zcp/"
        run: pnpm --filter @better-zcp/panel-client build

      - name: Publish to gh-pages branch
        uses: peaceiris/actions-gh-pages@1ef5a1b1df4c63fe21a2242edbee6cac921ece01
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: apps/panel-client/dist
          force_orphan: true
