name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  server:
    name: Server (lint + tests)
    runs-on: ubuntu-latest
    steps:
      # The server suite uses git history for translation-staleness checks.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.24.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Enable pnpm
        run: corepack enable && corepack install

      # The workspace lockfile is the single dependency source for both
      # packages, including platform-specific optional binaries.
      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint:server

      # Vitest can report an environment-teardown race after all tests pass.
      # Retry that exact error once, but never retry a real test failure.
      - name: Tests
        shell: bash
        run: |
          set -o pipefail
          if pnpm run test:server 2>&1 | tee /tmp/server-test-output.log; then
            exit 0
          fi
          if grep -q 'EnvironmentTeardownError' /tmp/server-test-output.log && \
             ! grep -q 'Failed Tests' /tmp/server-test-output.log; then
            echo "::warning::vitest-worker-teardown-flake-exits-1 (known upstream race, 0 real test failures) -- retrying once"
            pnpm run test:server
          else
            exit 1
          fi

  # Keep this independent from the dependency-heavy test jobs. The committed
  # manifest is checked in CI; regenerating it requires a local game JAR.
  engine-signatures:
    name: Engine signature check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Engine signature check
        run: node scripts/check-engine-signatures.mjs

  # Run source audits in their own job so failures identify the affected
  # contract. The RCON audit checks extraction only; it cannot query a live
  # server from CI. The i18n audit compares new findings with its reviewed
  # baseline.
  scripts-checkers:
    name: Scripts checkers (bridge actions/routes, RCON commands, i18n duplicates)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Bridge actions audit (Events.tsx/api.ts -> Lua handlers)
        run: node scripts/audit-bridge-actions.mjs .

      - name: Bridge routes audit (panelBridge.js routes -> Lua handlers)
        run: node scripts/audit-bridge-routes.mjs .

      - name: RCON commands (panel-side denominator only -- see step comment above)
        run: node scripts/audit-rcon-commands.mjs .

      - name: i18n French duplicate-value check (against the reviewed baseline)
        run: node scripts/i18n-check.mjs --all

  client:
    name: Client (lint + types + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.24.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Enable pnpm
        run: corepack enable && corepack install

      - name: Install
        run: pnpm install --filter pz-server-manager-client --frozen-lockfile

      - name: Lint
        working-directory: client
        run: pnpm run lint

      - name: Typecheck
        working-directory: client
        run: pnpm run typecheck

      - name: Tests
        working-directory: client
        run: pnpm run test

  windows-packaged-updater:
    name: Windows packaged updater
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.24.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Enable pnpm
        run: corepack enable && corepack install

      - name: Install server dependencies
        run: pnpm install --frozen-lockfile

      # These tests contain Windows-only branches. Running them on the Windows
      # job keeps path quoting, process spawning, and path guards covered.
      - name: Exercise bundle transaction and generated supervisor
        run: pnpm exec vitest run server/tests/panelUpdateBundle.test.js server/tests/supervisor-restart.test.js server/tests/serverManagerSpacedPathCmdQuoting.test.js server/tests/serverManagerWindowsSpawnFixes.test.js server/tests/serverManagerCustomStartCommandQuoting.test.js server/tests/serverManagerCommandLineRoundTrip.test.js server/tests/serverManagerEmptyScanWindows.test.js server/tests/serverManager-stopTimeout.test.js server/tests/setDataPaths.test.js

      - name: Build packaged Windows executable
        run: node build.js --windows

      - name: Verify packaged updater artifacts
        shell: pwsh
        run: |
          if (-not (Test-Path release\ZomboidControlPanel.exe)) { throw "Packaged executable is missing" }
          if (-not (Test-Path release\Start.bat)) { throw "Generated supervisor is missing" }
          $buildInfo = Get-Content release\client\dist\build-info.json -Raw | ConvertFrom-Json
          $manifest = Get-Content release\release-manifest.json -Raw | ConvertFrom-Json
          if ($buildInfo.panelVersion -ne $manifest.version) { throw "Frontend/backend version mismatch" }
          if ($buildInfo.buildSha -ne $manifest.buildSha) { throw "Frontend/backend build SHA mismatch" }
          if ($buildInfo.apiContractVersion -ne $manifest.apiContractVersion) { throw "Frontend/backend API contract mismatch" }
