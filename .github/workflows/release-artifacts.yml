name: Build Release Artifacts

on:
  push:
    tags:
      - "v2.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            artifact_name: windows-zip
            binary_artifact_name: windows-binary
            archive_file: ZomboidControlPanel-windows.zip
            archive_path: ZomboidControlPanel-windows.zip
            binary_file: ZomboidControlPanel.exe
            build_arg: --windows
          # Keep the standalone Linux binary compatible with glibc 2.28+
          # hosts. ubuntu-latest moved to 24.04 and raised the symbol floor.
          - os: ubuntu-22.04
            artifact_name: linux-tarball
            binary_artifact_name: linux-binary
            archive_file: ZomboidControlPanel-linux.tar.gz
            archive_path: release/ZomboidControlPanel-linux.tar.gz
            binary_file: ZomboidControlPanel
            build_arg: --linux
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Enable pnpm
        run: corepack enable && corepack install

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: node build.js ${{ matrix.build_arg }}

      - name: Verify release version parity
        if: startsWith(github.ref, 'refs/tags/')
        run: node scripts/verify-release-version.mjs "${{ github.ref_name }}"

      - name: Verify Linux ABI compatibility
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          max_glibc=$(grep -aohE 'GLIBC_[0-9.]+' release/ZomboidControlPanel | sort -Vu | tail -1)
          if [ -z "$max_glibc" ]; then
            echo "Could not determine the Linux binary glibc requirement" >&2
            exit 1
          fi
          highest=$(printf '%s\n' 'GLIBC_2.28' "$max_glibc" | sort -V | tail -1)
          if [ "$highest" != 'GLIBC_2.28' ]; then
            echo "Linux binary requires $max_glibc; maximum supported requirement is GLIBC_2.28" >&2
            exit 1
          fi
          echo "Linux binary glibc requirement: $max_glibc"

      - name: Package Windows archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path release\* -DestinationPath ${{ matrix.archive_file }}

      # Linux packaging is no longer a separate step: build.js itself writes
      # ZomboidControlPanel-linux.tar.gz with explicit per-entry mode bits as
      # part of the "Build" step above, so this leg exercises the exact same
      # packaging code a developer runs locally via `pnpm run build:exe:linux`
      # -- one path, not a CI-only recipe a local build can silently diverge
      # from.

      - name: Upload archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.archive_path }}
          if-no-files-found: error
          retention-days: 1

      - name: Upload raw binary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.binary_artifact_name }}
          path: release/${{ matrix.binary_file }}
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout release files
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Download Windows archive
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: windows-zip
          path: .

      - name: Download Linux archive
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: linux-tarball
          path: .

      - name: Download Windows binary
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: windows-binary
          path: .

      - name: Download Linux binary
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: linux-binary
          path: .

      - name: Package browser extension
        run: |
          set -euo pipefail
          cd browser-extension
          zip -r ../zomboid-panel-extension.zip . -x '*.DS_Store'

      - name: Generate checksums
        run: |
          sha256sum \
            ZomboidControlPanel.exe \
            ZomboidControlPanel \
            ZomboidControlPanel-windows.zip \
            ZomboidControlPanel-linux.tar.gz \
            zomboid-panel-extension.zip \
            docker-compose.install.yml \
            Dockerfile > checksums.txt

      - name: Create or update GitHub release
        id: create-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          release_tag="${GITHUB_REF_NAME}"
          if gh release view "$release_tag" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Release $release_tag already exists; uploading assets."
          else
            release_version="${release_tag#v}"
            # Match the heading by string prefix, not by regex. The previous version used
            # "^## \\[" inside an awk STRING, where the escape is implementation-defined:
            # gawk strips the backslash, turning [1.1.55] into a character class that cannot
            # match "## [1.1.55]", so the section was never found and every release silently
            # fell back to the placeholder below. mawk keeps it and the same line works. A
            # release note that depends on which awk the runner ships is not worth debugging
            # twice - index() has no escaping to get wrong.
            awk -v version="$release_version" '
              index($0, "## [" version "]") == 1 { in_section = 1; next }
              in_section && index($0, "## [") == 1 { exit }
              in_section { print }
            ' CHANGELOG.md > release-notes.md

            if [ ! -s release-notes.md ]; then
              # Do not fail the release HERE for a missing changelog entry -- the
              # artifacts still need to ship, and this branch only runs at all for
              # a release that bypassed the release pre-flight (which blocks a
              # missing heading before anything is built). A bypass is usually an
              # emergency, which is the worst moment to withhold an upload. The
              # "Fail if CHANGELOG entry was missing" step at the end of this job
              # fails the job loudly AFTER assets are uploaded -- see that step for
              # why this one only records the fact instead of stopping here.
              echo "::warning title=No changelog entry::CHANGELOG.md has no '## [${release_version}]' section. Publishing a placeholder instead of real release notes."
              printf 'Release %s\n\nSee CHANGELOG.md for details.\n' "$release_tag" > release-notes.md
              echo "changelog_missing=true" >> "$GITHUB_OUTPUT"
            fi

            gh release create "$release_tag" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "Release $release_tag" \
              --notes-file release-notes.md
          fi

      - name: Remove obsolete release-manifest.json from prior releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          release_tag="${GITHUB_REF_NAME}"
          gh release delete-asset "$release_tag" release-manifest.json --repo "${GITHUB_REPOSITORY}" --yes 2>/dev/null || true

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          release_tag="${GITHUB_REF_NAME}"
          for attempt in 1 2 3; do
            if gh release upload "$release_tag" \
              --repo "${GITHUB_REPOSITORY}" \
              --clobber \
              ZomboidControlPanel.exe \
              ZomboidControlPanel \
              ZomboidControlPanel-windows.zip \
              ZomboidControlPanel-linux.tar.gz \
              zomboid-panel-extension.zip \
              docker-compose.install.yml \
              Dockerfile \
              checksums.txt; then
              exit 0
            fi
            echo "Upload attempt $attempt failed; retrying in 5s..."
            sleep 5
          done
          exit 1

      # Runs last, deliberately: assets are already uploaded above by the time
      # this can fail, so a bypass release (one that skipped the normal
      # pre-flight block) still ships its binaries even though this makes the
      # job -- and the workflow run -- red. The normal pre-flight refuses to reach
      # this workflow at all when CHANGELOG.md has no matching heading; this is
      # only reachable by pushing a v2.* tag some other way. Loud, not silent,
      # without withholding the artifacts a real emergency release needs.
      - name: Fail if the release shipped without a CHANGELOG entry
        if: steps.create-release.outputs.changelog_missing == 'true'
        run: |
          echo "::error title=No changelog entry::Release ${GITHUB_REF_NAME} shipped with assets uploaded, but CHANGELOG.md had no '## [${GITHUB_REF_NAME#v}]' section, so its release notes are a placeholder. Add the section, update the release notes (gh release edit ${GITHUB_REF_NAME} --notes-file <file>), and find out how this tag was pushed without going through the release pre-flight check."
          exit 1
