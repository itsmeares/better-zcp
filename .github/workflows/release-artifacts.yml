name: Build Release Artifacts

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "package.json"
      - "apps/panel-client/package.json"
      - "apps/panel-server/package.json"
      - "scripts/release/**"
      - "scripts/verify-release-version.mjs"
      - ".github/workflows/release-artifacts.yml"
      - "docs/releases/**"
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            artifact_name: windows-zip
            binary_artifact_name: windows-binary
            archive_file: ZomboidControlPanel-windows.zip
            archive_path: ZomboidControlPanel-windows.zip
            binary_file: ZomboidControlPanel.exe
            build_arg: --windows
          - os: ubuntu-22.04
            artifact_name: linux-tarball
            binary_artifact_name: linux-binary
            archive_file: ZomboidControlPanel-linux.tar.gz
            archive_path: release/ZomboidControlPanel-linux.tar.gz
            binary_file: ZomboidControlPanel
            build_arg: --linux
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: pnpm/action-setup@d9184bf108216479bc5a137cc391f4d7b14c870b
        with:
          version: 11.24.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: pnpm

      - name: Enable pnpm
        run: corepack enable && corepack install

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: node scripts/release/build.mjs ${{ matrix.build_arg }}

      - name: Smoke-test packaged release
        run: node scripts/smoke-release.mjs

      - name: Install Chromium for packaged auth smoke
        if: runner.os == 'Linux'
        run: pnpm exec playwright install --with-deps chromium

      - name: Install Chromium for packaged auth smoke
        if: runner.os == 'Windows'
        run: pnpm exec playwright install chromium

      - name: Smoke-test packaged auth persistence
        env:
          RUN_AUTH_SMOKE: "1"
        run: node scripts/smoke-release.mjs

      - name: Verify release version parity
        shell: bash
        run: |
          version="$GITHUB_REF_NAME"
          if [[ "$GITHUB_REF_TYPE" != tag ]]; then
            version="$(node -p "require('./package.json').version")"
          fi
          node scripts/verify-release-version.mjs "$version"

      - name: Verify Linux ABI compatibility
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          max_glibc=$(grep -aohE 'GLIBC_[0-9.]+' release/ZomboidControlPanel | sort -Vu | tail -1)
          if [ -z "$max_glibc" ]; then
            echo "Could not determine the Linux binary glibc requirement" >&2
            exit 1
          fi
          highest=$(printf '%s\n' 'GLIBC_2.28' "$max_glibc" | sort -V | tail -1)
          if [ "$highest" != 'GLIBC_2.28' ]; then
            echo "Linux binary requires $max_glibc; maximum supported requirement is GLIBC_2.28" >&2
            exit 1
          fi
          echo "Linux binary glibc requirement: $max_glibc"

      - name: Package Windows archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path release\* -DestinationPath ${{ matrix.archive_file }}

      - name: Upload archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.archive_path }}
          if-no-files-found: error
          retention-days: 7

      - name: Upload raw binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ matrix.binary_artifact_name }}
          path: release/${{ matrix.binary_file }}
          if-no-files-found: error
          retention-days: 7

  image:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302
        with:
          images: ghcr.io/itsmeares/better-zcp
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            PANEL_BUILD_SHA=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [build, image]
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Checkout release files
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Download Windows archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: windows-zip
          path: .

      - name: Download Linux archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: linux-tarball
          path: .

      - name: Download Windows binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: windows-binary
          path: .

      - name: Download Linux binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: linux-binary
          path: .

      - name: Generate checksums
        run: |
          sha256sum \
            ZomboidControlPanel.exe \
            ZomboidControlPanel \
            ZomboidControlPanel-windows.zip \
            ZomboidControlPanel-linux.tar.gz \
            docker-compose.yml \
            docker-compose.panel-only.yml > checksums.txt

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          release_tag="${GITHUB_REF_NAME}"
          if gh release view "$release_tag" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Release $release_tag already exists; uploading assets."
            gh release edit "$release_tag" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "$release_tag"
            if [[ "$release_tag" == *-* ]]; then
              gh release edit "$release_tag" \
                --repo "${GITHUB_REPOSITORY}" \
                --prerelease
            fi
          else
            release_args=(
              --repo "${GITHUB_REPOSITORY}"
              --title "$release_tag"
              --notes-file "docs/releases/${release_tag#v}.md"
            )
            if [[ "$release_tag" == *-* ]]; then
              release_args+=(--prerelease)
            fi
            gh release create "$release_tag" "${release_args[@]}"
          fi

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          release_tag="${GITHUB_REF_NAME}"
          for attempt in 1 2 3; do
            if gh release upload "$release_tag" \
              --repo "${GITHUB_REPOSITORY}" \
              --clobber \
              ZomboidControlPanel.exe \
              ZomboidControlPanel \
              ZomboidControlPanel-windows.zip \
              ZomboidControlPanel-linux.tar.gz \
              docker-compose.yml \
              docker-compose.panel-only.yml \
              checksums.txt; then
              exit 0
            fi
            echo "Upload attempt $attempt failed; retrying in 5s..."
            sleep 5
          done
          exit 1

  latest:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Move latest and stable to this release
        run: |
          set -euo pipefail
          image=ghcr.io/itsmeares/better-zcp
          version="${GITHUB_REF_NAME#v}"
          # Newest first, with a release candidate sorting before its final release.
          versions="$(git -c versionsort.suffix=- ls-remote --sort=-v:refname --tags --refs "https://github.com/${GITHUB_REPOSITORY}" 'refs/tags/v*' | sed 's#.*refs/tags/v##')"
          newest="$(head -n 1 <<<"$versions")"
          newest_stable="$(grep -v -- '-' <<<"$versions" | head -n 1 || true)"
          tags=()
          if [[ "$version" == "$newest" ]]; then
            tags+=(--tag "$image:latest")
          else
            echo "v$newest is newer; leaving latest alone."
          fi
          if [[ "$version" != *-* && "$version" == "$newest_stable" ]]; then
            tags+=(--tag "$image:stable")
          fi
          if (( ${#tags[@]} )); then
            docker buildx imagetools create "${tags[@]}" "$image:$version"
          fi
