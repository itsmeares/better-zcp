<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/zombie.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Admin control panel for Project Zomboid dedicated servers - manage players, mods, backups, and more" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#161616" />
    <!-- Applies the theme class before first paint. Must match parseTheme()
         and applyTheme() in contexts/ThemeContext.tsx. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('pz-panel-theme');
          var theme = stored === 'survival' ? 'dark' : stored;
          var dark = theme === 'dark' || (theme !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('dark', dark);
          document.documentElement.classList.toggle('light', !dark);
        } catch (e) { /* storage unavailable: the static dark class stands */ }
      })();
    </script>
    <title>Zomboid Control Panel</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
