services:
  panel:
    image: zomboid-panel-allinone:latest
    build:
      context: ../source
      dockerfile: infra/docker/all-in-one/Dockerfile
    container_name: zomboid-panel
    restart: unless-stopped
    ports:
      - "3001:3001"
      # PZ DefaultPort and UDPPort. The all-in-one installer owns the game
      # server, so these must be published here rather than added by hand.
      - "16261:16261/udp"
      - "16262:16262/udp"
    environment:
      NODE_ENV: production
      PZ_SERVER_PATH: /pz-server
      PZ_SAVE_PATH: /zomboid
      PZ_SERVER_BAT: start-server.sh
      RCON_HOST: 127.0.0.1
      RCON_PORT: 27015
      CORS_ORIGINS: ${CORS_ORIGINS:?Set CORS_ORIGINS in .env}
      TRUST_PROXY: ${TRUST_PROXY:-1}
      PANEL_LAN_IP: ${PANEL_LAN_IP:-}
      PANEL_WAN_IP: ${PANEL_WAN_IP:-}
      PANEL_DOCKER_UPDATER_URL: http://zomboid-panel-updater:3100
      PANEL_DOCKER_UPDATER_TOKEN: ${PANEL_DOCKER_UPDATER_TOKEN:?Set PANEL_DOCKER_UPDATER_TOKEN in .env}
    volumes:
      - panel-data:/app/data
      - panel-logs:/app/logs
      - pz-server:/pz-server
      - zomboid-data:/zomboid
    depends_on:
      updater:
        condition: service_healthy

  updater:
    image: zomboid-panel-updater:latest
    build:
      context: ../source
      dockerfile: infra/docker/all-in-one/updater/Dockerfile
    container_name: zomboid-panel-updater
    restart: unless-stopped
    environment:
      UPDATE_TOKEN: ${PANEL_DOCKER_UPDATER_TOKEN:?Set PANEL_DOCKER_UPDATER_TOKEN in .env}
      BUILD_ROOT: /build
      COMPOSE_FILE: /build/ctx/docker-compose.yml
      PANEL_CONTAINER: zomboid-panel
      PANEL_IMAGE: zomboid-panel-allinone:latest
      GITHUB_REPOSITORY: itsmeares/better-zcp
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${PANEL_BUILD_DIR:?Set PANEL_BUILD_DIR in .env}:/build
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:3100/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  panel-data:
  panel-logs:
  pz-server:
  zomboid-data:
