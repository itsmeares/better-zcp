services:
  panel:
    image: zomboid-panel-allinone:latest
    build:
      context: ../source
      dockerfile: infra/docker/all-in-one/Dockerfile
    container_name: zomboid-panel
    restart: unless-stopped
    ports:
      - "3001:3001"
      - "16261:16261/udp"
      - "16262:16262/udp"
    environment:
      NODE_ENV: production
      PZ_SERVER_PATH: /pz-server
      PZ_SAVE_PATH: /zomboid
      PZ_SERVER_BAT: start-server.sh
      RCON_HOST: 127.0.0.1
      RCON_PORT: 27015
      CORS_ORIGINS: ${CORS_ORIGINS:?Set CORS_ORIGINS in .env}
      TRUST_PROXY: ${TRUST_PROXY:-1}
      PANEL_LAN_IP: ${PANEL_LAN_IP:-}
      PANEL_WAN_IP: ${PANEL_WAN_IP:-}
      PANEL_DOCKER_INSTALL_KIND: aio
    volumes:
      - panel-data:/app/data
      - panel-logs:/app/logs
      - pz-server:/pz-server
      - zomboid-data:/zomboid

volumes:
  panel-data:
  panel-logs:
  pz-server:
  zomboid-data:
